<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar 2027 — MedAssist KK Bangi</title>
<style>
:root{
  --ink:#263634;--muted:#6f7f7b;--paper:#fffdf8;--line:#dce7e2;
  --holiday:#b667bd;--holiday-soft:#f2e2f5;--blocked:#ff4f98;--blocked-soft:#ffe3ef;
  --green:#226d62;--green-soft:#eaf5f2;--warm:#b84c16;--shadow:0 18px 50px rgba(40,64,58,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:
  radial-gradient(circle at 8% 8%,rgba(132,205,230,.18),transparent 25%),
  radial-gradient(circle at 86% 18%,rgba(171,190,151,.25),transparent 28%),
  radial-gradient(circle at 14% 84%,rgba(143,213,207,.20),transparent 24%),
  radial-gradient(circle at 55% 90%,rgba(255,156,181,.16),transparent 22%),
  #f8f6f0;min-height:100vh}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:46% 54% 61% 39%/50% 44% 56% 50%;filter:blur(1px);opacity:.45;pointer-events:none}
body::before{width:360px;height:500px;right:-100px;top:80px;background:radial-gradient(circle at 40% 40%,#9eb49c 0 18%,#c7d0b6 19% 36%,#e6d5b3 37% 48%,transparent 49%)}
body::after{width:420px;height:220px;left:15%;bottom:-70px;background:radial-gradient(circle at 28% 50%,#8ed0c7 0 19%,transparent 20%),radial-gradient(circle at 62% 42%,#f19bb5 0 18%,transparent 19%),radial-gradient(circle at 80% 62%,#dbc68e 0 18%,transparent 19%)}
.wrap{width:min(1600px,96vw);margin:0 auto;padding:30px 0 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--green);font-weight:800;background:#ffffffcc;border:1px solid var(--line);padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(34,80,70,.07)}
.title{text-align:center;margin:0 0 20px;font-size:clamp(38px,6vw,78px);letter-spacing:.16em;color:#8b0707;text-shadow:0 4px 8px rgba(90,30,20,.12);font-weight:800}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 auto 20px;padding:12px;background:#ffffffbf;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.control{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.control input{accent-color:var(--green)}
.legend-dot{width:15px;height:15px;border-radius:4px;display:inline-block}.holiday-dot{background:var(--holiday)}.blocked-dot{background:var(--blocked)}
.ramadan-note{display:flex;align-items:center;justify-content:center;text-align:center;max-width:680px;margin:0 auto 24px;padding:13px 16px;border-radius:16px;border:1px solid #edcfd9;background:linear-gradient(135deg,#fff9fb,#f9eef4);font-weight:800;color:#53313d}
.month-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-items:start}
.month-card{position:relative;background:rgba(255,255,255,.80);backdrop-filter:blur(4px);border:1px solid rgba(205,220,214,.95);border-radius:20px;padding:13px;box-shadow:0 10px 26px rgba(48,79,71,.08);transition:.18s ease;overflow:hidden}
.month-card::before{content:"";position:absolute;inset:-30px auto auto -25px;width:100px;height:55px;border-radius:50%;background:radial-gradient(ellipse,#c8efff 0 45%,rgba(200,239,255,.35) 46% 70%,transparent 72%);opacity:.8;pointer-events:none}
.month-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(48,79,71,.13)}
.month-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.month-title{margin:0;color:#cf2c28;font-size:20px;letter-spacing:.04em;font-weight:900}.focus-btn{border:0;background:#eef8f5;color:var(--green);border-radius:10px;padding:6px 8px;font-weight:800;cursor:pointer}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.weekdays{margin-bottom:4px}.weekday{text-align:center;font-size:11px;font-weight:900;padding:5px 0;background:#fffadc;border-radius:6px}.weekday.weekend{background:#f1e7e5}
.day{position:relative;min-height:32px;border:1px solid transparent;background:#ffffffb8;border-radius:7px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:default;padding:0}.day.empty{background:transparent}.day.weekend{background:#f7f2eb}.day.marked{cursor:pointer;border-color:rgba(0,0,0,.04);font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}.day.holiday{background:var(--holiday);color:white}.day.blocked{background:linear-gradient(180deg,#ff77b0,var(--blocked));color:#24121b}.day.both{background:linear-gradient(135deg,var(--holiday) 0 49%,var(--blocked) 50% 100%);color:white}.day.hidden-mark{background:#fff!important;color:var(--ink)!important;box-shadow:none!important}.day[aria-label]:focus-visible{outline:3px solid #1c7f71;outline-offset:2px}
.month-events{margin-top:10px;border-top:1px dashed #d7e2de;padding-top:8px;font-size:11px;color:#5d6f6b;line-height:1.45}.month-events strong{color:#344d47}.month-events:empty{display:none}
.summary{margin-top:26px;background:#ffffffd9;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.summary h2{margin:0 0 14px;font-size:20px}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.summary-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.summary-item strong{display:block;margin-bottom:5px;color:#6e2117}.summary-item span{font-size:12px;line-height:1.45;color:#53635f}
.dialog-backdrop{position:fixed;inset:0;background:rgba(20,37,33,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:4000}.dialog-backdrop.hidden{display:none}.dialog{width:min(720px,96vw);max-height:90vh;overflow:auto;background:#fffdf8;border-radius:22px;border:1px solid var(--line);padding:20px;box-shadow:0 28px 70px rgba(0,0,0,.25)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.dialog-head h2{margin:0;font-size:24px}.close-btn{border:0;background:#eef4f2;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer}.dialog-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dialog-calendar .day{min-height:56px;font-size:15px}.detail{margin-top:14px;padding:13px 14px;border-radius:14px;background:#f4f8f7;border:1px solid var(--line);min-height:52px}.detail strong{display:block;margin-bottom:4px}.detail small{color:var(--muted)}
@media(max-width:1250px){.month-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.month-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.wrap{width:min(96vw,560px);padding-top:16px}.topbar{align-items:flex-start}.month-grid{grid-template-columns:1fr 1fr;gap:10px}.month-card{padding:10px}.month-title{font-size:17px}.weekday{font-size:9px}.day{font-size:11px;min-height:28px}.summary-grid{grid-template-columns:1fr}.title{letter-spacing:.08em;margin-bottom:12px}.controls{justify-content:flex-start}}
@media(max-width:420px){.month-grid{grid-template-columns:1fr}.month-card{padding:14px}.day{min-height:34px}.weekday{font-size:11px}}
@media print{body{background:#fff}.topbar,.controls,.focus-btn,.dialog-backdrop{display:none!important}.wrap{width:100%;padding:0}.title{font-size:36px;margin:0 0 12px}.month-grid{grid-template-columns:repeat(4,1fr);gap:8px}.month-card{break-inside:avoid;box-shadow:none;border-color:#bbb}.summary{box-shadow:none;break-inside:avoid}.ramadan-note{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="index.html" aria-label="Back to MedAssist">← MedAssist</a></div>
  <h1 class="title">CALENDAR 2027</h1>

  <div class="controls" aria-label="Calendar filters">
    <label class="control"><input id="filterHoliday" type="checkbox" checked><span class="legend-dot holiday-dot"></span> Public Holiday</label>
    <label class="control"><input id="filterBlocked" type="checkbox" checked><span class="legend-dot blocked-dot"></span> Blocked NCD</label>
    <label class="control"><input id="filterRamadan" type="checkbox" checked> Ramadhan note</label>
  </div>
  <div id="ramadanNote" class="ramadan-note">Ramadhan (no fasting blood ix): 8/2/27 – 9/3/27</div>

  <main id="monthGrid" class="month-grid" aria-label="2027 calendar"></main>

  <section class="summary" aria-labelledby="summaryTitle">
    <h2 id="summaryTitle">Holiday & planning notes</h2>
    <div id="summaryGrid" class="summary-grid"></div>
  </section>
</div>

<div id="dialogBackdrop" class="dialog-backdrop hidden" role="presentation">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-head"><h2 id="dialogTitle"></h2><button id="dialogClose" class="close-btn" type="button" aria-label="Close">×</button></div>
    <div id="dialogCalendar" class="dialog-calendar"></div>
    <div id="dialogDetail" class="detail"><small>Choose a marked date to view details.</small></div>
  </section>
</div>

<script>
(()=>{
  'use strict';
  const YEAR=2027;
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const weekdays=['MO','TU','WE','TH','FR','SA','SU'];
  const data={
    '2027-01-01':{type:'holiday',label:'New Year'},'2027-01-22':{type:'holiday',label:'Thaipusam'},'2027-01-04':{type:'blocked',label:'Blocked NCD'},'2027-01-25':{type:'blocked',label:'Blocked NCD'},
    '2027-02-08':{type:'holiday',label:'Cuti peristiwa CNY'},'2027-02-24':{type:'holiday',label:'Nuzul Al-Quran'},'2027-02-09':{type:'blocked',label:'Blocked NCD'},
    '2027-03-10':{type:'holiday',label:'Raya Eid'},'2027-03-11':{type:'holiday',label:'Raya Eid'},'2027-03-05':{type:'blocked',label:'Blocked NCD'},'2027-03-08':{type:'blocked',label:'Blocked NCD'},'2027-03-09':{type:'blocked',label:'Blocked NCD'},'2027-03-12':{type:'blocked',label:'Blocked NCD'},'2027-03-15':{type:'blocked',label:'Blocked NCD'},'2027-03-16':{type:'blocked',label:'Blocked NCD'},
    '2027-05-17':{type:'holiday',label:'Raya Haji'},'2027-05-20':{type:'holiday',label:'Vesak'},'2027-05-13':{type:'blocked',label:'Blocked NCD'},'2027-05-14':{type:'blocked',label:'Blocked NCD'},'2027-05-18':{type:'blocked',label:'Blocked NCD'},'2027-05-19':{type:'blocked',label:'Blocked NCD'},
    '2027-06-07':{type:'holiday',label:'Birthday Agong'},'2027-06-08':{type:'holiday',label:'Awal Muharram'},'2027-06-09':{type:'blocked',label:'Blocked NCD'},
    '2027-08-16':{type:'holiday',label:'Maulidurrasul'},'2027-08-31':{type:'holiday',label:'Merdeka!'},'2027-08-17':{type:'blocked',label:'Blocked NCD'},
    '2027-09-16':{type:'holiday',label:'Hari Malaysia'},
    '2027-10-28':{type:'holiday',label:'Deepavali'}
  };
  const monthlyNotes={
    0:['1: New Year','22: Thaipusam'],1:['8: Cuti peristiwa CNY','24: Nuzul Al-Quran'],2:['10–11: Raya Eid'],4:['17: Raya Haji','20: Vesak'],5:['7: Birthday Agong','8: Awal Muharram'],7:['16: Maulidurrasul','31: Merdeka!'],8:['16: Hari Malaysia'],9:['28: Deepavali']
  };
  const grid=document.getElementById('monthGrid'),summary=document.getElementById('summaryGrid');
  const filterHoliday=document.getElementById('filterHoliday'),filterBlocked=document.getElementById('filterBlocked'),filterRamadan=document.getElementById('filterRamadan');
  const backdrop=document.getElementById('dialogBackdrop'),dialogTitle=document.getElementById('dialogTitle'),dialogCalendar=document.getElementById('dialogCalendar'),dialogDetail=document.getElementById('dialogDetail'),dialogClose=document.getElementById('dialogClose');

  const pad=n=>String(n).padStart(2,'0');
  const keyFor=(m,d)=>`${YEAR}-${pad(m+1)}-${pad(d)}`;
  const daysInMonth=m=>new Date(Date.UTC(YEAR,m+1,0)).getUTCDate();
  const mondayOffset=m=>{const dow=new Date(Date.UTC(YEAR,m,1)).getUTCDay();return (dow+6)%7};
  function markerClass(ev){return ev?.type||''}
  function isVisible(ev){if(!ev)return true;if(ev.type==='holiday')return filterHoliday.checked;if(ev.type==='blocked')return filterBlocked.checked;return true}
  function dayButton(m,d,large=false){
    const key=keyFor(m,d),ev=data[key],dow=new Date(Date.UTC(YEAR,m,d)).getUTCDay(),weekend=(dow===0||dow===6);
    const b=document.createElement('button');b.type='button';b.className=`day${weekend?' weekend':''}${ev?' marked '+markerClass(ev):''}${ev&&!isVisible(ev)?' hidden-mark':''}`;b.textContent=d;
    if(!ev){b.disabled=true;b.tabIndex=-1;return b}
    b.setAttribute('aria-label',`${d} ${months[m]} ${YEAR}: ${ev.label}, ${ev.type==='holiday'?'Public Holiday':'Blocked NCD'}`);
    b.title=`${ev.label} — ${ev.type==='holiday'?'Public Holiday':'Blocked NCD'}`;
    b.addEventListener('click',e=>{e.stopPropagation();showDetail(m,d,ev,large)});return b
  }
  function buildMonth(m,container,large=false){
    container.innerHTML='';weekdays.forEach((w,i)=>{const x=document.createElement('div');x.className='weekday'+(i>4?' weekend':'');x.textContent=w;container.appendChild(x)});
    for(let i=0;i<mondayOffset(m);i++){const x=document.createElement('div');x.className='day empty';container.appendChild(x)}
    for(let d=1;d<=daysInMonth(m);d++)container.appendChild(dayButton(m,d,large));
  }
  function createMonthCard(m){
    const card=document.createElement('section');card.className='month-card';card.dataset.month=String(m);
    const head=document.createElement('div');head.className='month-head';
    const h=document.createElement('h2');h.className='month-title';h.textContent=months[m];
    const f=document.createElement('button');f.className='focus-btn';f.type='button';f.textContent='Focus';f.setAttribute('aria-label',`Focus ${months[m]}`);f.addEventListener('click',()=>openMonth(m));head.append(h,f);
    const wd=document.createElement('div');wd.className='weekdays';weekdays.forEach((w,i)=>{const x=document.createElement('div');x.className='weekday'+(i>4?' weekend':'');x.textContent=w;wd.appendChild(x)});
    const days=document.createElement('div');days.className='days';for(let i=0;i<mondayOffset(m);i++){const x=document.createElement('div');x.className='day empty';days.appendChild(x)}for(let d=1;d<=daysInMonth(m);d++)days.appendChild(dayButton(m,d));
    const events=document.createElement('div');events.className='month-events';const notes=monthlyNotes[m]||[];if(notes.length)events.innerHTML='<strong>Notes:</strong> '+notes.join(' · ');
    card.append(head,wd,days,events);card.addEventListener('dblclick',()=>openMonth(m));return card
  }
  function render(){grid.innerHTML='';for(let m=0;m<12;m++)grid.appendChild(createMonthCard(m));filterRamadan.checked?document.getElementById('ramadanNote').classList.remove('hidden'):document.getElementById('ramadanNote').classList.add('hidden')}
  function renderSummary(){summary.innerHTML='';Object.keys(monthlyNotes).map(Number).sort((a,b)=>a-b).forEach(m=>{const item=document.createElement('div');item.className='summary-item';item.innerHTML=`<strong>${months[m]}</strong><span>${monthlyNotes[m].join('<br>')}</span>`;summary.appendChild(item)})}
  function openMonth(m){dialogTitle.textContent=`${months[m]} ${YEAR}`;buildMonth(m,dialogCalendar,true);dialogDetail.innerHTML='<small>Choose a marked date to view details.</small>';backdrop.classList.remove('hidden');dialogClose.focus()}
  function showDetail(m,d,ev,large){const html=`<strong>${d} ${months[m]} ${YEAR}</strong><div>${ev.label}</div><small>${ev.type==='holiday'?'Public Holiday':'Blocked NCD'}</small>`;if(large){dialogDetail.innerHTML=html}else{openMonth(m);dialogDetail.innerHTML=html}}
  function closeDialog(){backdrop.classList.add('hidden')}
  [filterHoliday,filterBlocked].forEach(x=>x.addEventListener('change',render));filterRamadan.addEventListener('change',()=>{document.getElementById('ramadanNote').style.display=filterRamadan.checked?'flex':'none'});
  dialogClose.addEventListener('click',closeDialog);backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!backdrop.classList.contains('hidden'))closeDialog()});
  render();renderSummary();
})();
</script>
</body>
</html>
